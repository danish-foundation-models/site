# DFM team members: the single source for the People page, the news author bylines and
# the publications page. Order here is the order on the People page.
# People are grouped by `tier` (1 = most senior, shown first) and sorted by name within a tier.
# Edit this file, then run `make build` (or `uv run python scripts/build_people.py`).
#
#   hired       Date they joined DFM (YYYY-MM-DD). Publications are only searched from this date
#               (never earlier than `since` in publications/config.yml). Empty = use `since`.
#   left        Date they left DFM (YYYY-MM-DD); only papers up to this date are listed for them.
#   openalex    OpenAlex author ids used to find their publications (none = no papers listed).
#   aliases     Other spellings of their name used on papers (matched only if they have OpenAlex ids).
#   website     Personal or lab site (full URL).
#   github      GitHub username.   huggingface   Hugging Face username.
#   orcid       ORCID iD (0000-0000-0000-0000).
#   bluesky     Bluesky handle (e.g. name.bsky.social), shown as an icon on the card.
#   linkedin    Full LinkedIn profile URL, shown as an icon on the card.
#   portrait    Path (relative to the docs root) of their portrait article, per language.
#   show        Set to false to hide them from the People page for now (news bylines and
#               publications still use them; commenting a person out would drop both).
#   alumni      Set to true to list them under "Alumni" at the bottom of the People page.
#   news_author Set to false to keep someone out of .authors.yml (default: true).

