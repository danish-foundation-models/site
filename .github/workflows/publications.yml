# Fetches the publication lists (OpenAlex, ORCID, Semantic Scholar), stores them on the
# publications-data branch and asks the Documentation workflow to rebuild the site.
# main is protected, so the data lives on its own branch instead of being committed to main.
name: Publications

on:
  schedule:
    - cron: "17 4 * * *"  # daily; change to e.g. "17 4 * * 1" for weekly
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Dependencies
        run: uv sync

      # start from the previous data so a failed fetch keeps the last good lists
      - name: Previous data
        run: |
          git fetch origin publications-data || true
          if git rev-parse --verify --quiet origin/publications-data >/dev/null; then
            git checkout origin/publications-data -- \
              publications/openalex_publications.bib publications/orcid_publications.bib \
              publications/semanticscholar_publications.bib
          fi

      - name: Fetch publications
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: uv run python scripts/fetch_publications.py

      - name: Save data to the publications-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/pubdata
          cp publications/openalex_publications.bib publications/orcid_publications.bib \
             publications/semanticscholar_publications.bib /tmp/pubdata/
          git checkout --orphan publications-data-new
          git rm -rf --quiet . || true
          mkdir -p publications
          cp /tmp/pubdata/*.bib publications/
          git add publications
          git commit -m "Update publication data [skip ci]"
          git push --force origin publications-data-new:publications-data

      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run documentation.yml --ref main
