# builds the documentation and pushes it to the gh-pages branch (on every push to main)
name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# one run at a time
concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.10"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies
        run: uv sync

      # The publication data is fetched separately (publications.yml, daily) and kept on the
      # publications-data branch. Here we only take the latest data and render the pages from it,
      # which needs no network and takes seconds. Falls back to the copies on main if there is none yet.
      - name: Latest publication data
        run: |
          git fetch origin publications-data || true
          if git rev-parse --verify --quiet origin/publications-data >/dev/null; then
            git checkout origin/publications-data -- \
              publications/openalex_publications.bib publications/orcid_publications.bib \
              publications/semanticscholar_publications.bib
          fi
          PUBLICATIONS_RENDER_ONLY=1 uv run python scripts/fetch_publications.py

      - name: Build site
        run: make build

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
