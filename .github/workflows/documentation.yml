# creates the documentation and pushes it to the gh-pages branch
name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"  # daily, refreshes the publications page
  workflow_dispatch:

permissions:
  contents: write

# one run at a time, so the daily refresh never races with a push
concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.10"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies
        run: uv sync

      - name: Update publications
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: uv run python scripts/fetch_publications.py

      - name: Commit updated publications
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/openalex_publications.bib publications/orcid_publications.bib publications/semanticscholar_publications.bib en/docs/publications.bib en/docs/publications.md da/docs/publications.md
          git diff --cached --quiet || git commit -m "Update publications [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"  # someone may have pushed while we fetched
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build site
        run: make build

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
